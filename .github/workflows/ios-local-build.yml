name: Build iOS on macOS (EAS Local) & Upload IPA

# Builds the iOS app locally on GitHub's macOS runner using EAS CLI --local.
# Xcode 16 has Swift 6 strict concurrency which breaks Expo SDK 55.
# We patch the SOURCE files in node_modules before EAS re-runs pod install.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      submit_to_testflight:
        description: 'Submit IPA to TestFlight after build?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Patch Expo Modules for Xcode 16
        run: |
          # Patch SOURCE files in node_modules — EAS will copy these to ios/Pods/ during its internal pod install
          CORE="node_modules/expo-modules-core/ios"
          
          # Patch 1: ExpoReactDelegate.swift — UIViewController() isolation
          FILE="$CORE/ReactDelegates/ExpoReactDelegate.swift"
          if [ -f "$FILE" ]; then
            sed -i '' 's/return windowScene?.keyWindow?.rootViewController?.children.first(where: { _ in true }) ?? UIViewController()/return windowScene?.keyWindow?.rootViewController?.children.first(where: { _ in true }) ?? MainActor.assumeIsolated { UIViewController() }/' "$FILE" 2>/dev/null || \
            sed -i 's/return windowScene?.keyWindow?.rootViewController?.children.first(where: { _ in true }) ?? UIViewController()/return windowScene?.keyWindow?.rootViewController?.children.first(where: { _ in true }) ?? MainActor.assumeIsolated { UIViewController() }/' "$FILE"
            echo "✅ Patched ExpoReactDelegate.swift"
          fi
          
          # Patch 2: PersistentFileLog.swift — filter non-sendable type
          FILE="$CORE/Core/Logging/PersistentFileLog.swift"
          if [ -f "$FILE" ]; then
            # Replace filter parameter with @Sendable closure
            sed -i '' 's/filter: @escaping PersistentFileLogFilter/filter: @escaping @Sendable PersistentFileLogFilter/' "$FILE" 2>/dev/null || \
            sed -i 's/filter: @escaping PersistentFileLogFilter/filter: @escaping @Sendable PersistentFileLogFilter/' "$FILE"
            echo "✅ Patched PersistentFileLog.swift"
          fi
          
          # Patch 3: SwiftUIHostingView.swift — @MainActor protocol conformance
          FILE="$CORE/Core/Views/SwiftUI/SwiftUIHostingView.swift"
          if [ -f "$FILE" ]; then
            # Add @preconcurrency to protocol conformance or @MainActor to class
            sed -i '' 's/^public class ExpoSwiftUIHostingView:/@MainActor\npublic class ExpoSwiftUIHostingView:/' "$FILE" 2>/dev/null || \
            sed -i 's/^public class ExpoSwiftUIHostingView:/@MainActor\npublic class ExpoSwiftUIHostingView:/' "$FILE"
            echo "✅ Patched SwiftUIHostingView.swift"
          fi
          
          echo "All patches applied to node_modules source files"

      - name: Setup EAS CLI
        run: |
          npm install -g eas-cli@latest
          eas --version

      - name: Build iOS Locally (EAS)
        run: |
          mkdir -p build-output
          eas build --platform ios --profile production --local --output build-output/buildtrack.ipa --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Verify IPA
        run: |
          ls -la build-output/buildtrack.ipa
          file build-output/buildtrack.ipa

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: buildtrack-ios-ipa
          path: build-output/buildtrack.ipa
          retention-days: 7

      - name: Submit to TestFlight
        if: ${{ github.event.inputs.submit_to_testflight == 'true' }}
        run: |
          xcrun altool --upload-app \
            -f build-output/buildtrack.ipa \
            -t ios \
            -u "${{ secrets.APPLE_ID }}" \
            -p "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
            --verbose

      - name: Notify
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Build complete!"
            echo "   IPA: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "❌ Build failed"
          fi
