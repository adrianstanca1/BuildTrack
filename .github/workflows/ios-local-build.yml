name: Build iOS IPA & Upload to TestFlight

# Build iOS app via expo prebuild + raw xcodebuild on GitHub macOS runner.
# Patches expo-modules-core for Xcode 16 / Swift 6 before pod install.
# Uploads IPA artifact and optionally submits to TestFlight.

env:
  DEVELOPMENT_TEAM: 4G3G5MX9BH
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      submit_to_testflight:
        description: 'Submit IPA to TestFlight after build?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Patch ExpoModulesCore (node_modules)
        run: node scripts/patch-expo-modules.js

      - name: Pod Install
        run: cd ios && pod install --verbose

      - name: Patch ExpoModulesCore (Pods)
        run: |
          PODS_PATH=$(find ios/Pods -path '*/ExpoModulesCore/ios' -type d | head -1)
          if [ -n "$PODS_PATH" ]; then
            echo "Found ExpoModulesCore at: $PODS_PATH"
            node scripts/patch-expo-modules.js "$PODS_PATH"
          else
            echo "WARNING: ExpoModulesCore not found in Pods"
          fi

      - name: Build iOS Archive
        run: |
          cd ios
          xcodebuild -workspace BuildTrack.xcworkspace \
            -scheme BuildTrack \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="${DEVELOPMENT_TEAM}" \
            CODE_SIGN_STYLE="Automatic" \
            archive -archivePath build/BuildTrack.xcarchive \
            -allowProvisioningUpdates
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Export IPA
        run: |
          cd ios
          xcodebuild -exportArchive \
            -archivePath build/BuildTrack.xcarchive \
            -exportPath ../build-output \
            -exportOptionsPlist ../exportOptions.plist

      - name: Verify IPA
        run: |
          ls -la build-output/*.ipa
          file build-output/*.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: buildtrack-ios-ipa
          path: build-output/*.ipa
          retention-days: 7

      - name: Submit to TestFlight
        if: ${{ github.event.inputs.submit_to_testflight == 'true' }}
        run: |
          xcrun altool --upload-app \
            -f build-output/*.ipa \
            -t ios \
            -u "${{ secrets.APPLE_ID }}" \
            -p "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
            --verbose

      - name: Notify
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Build complete!"
            echo "   IPA: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "❌ Build failed"
          fi
