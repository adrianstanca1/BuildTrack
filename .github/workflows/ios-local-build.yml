name: Build iOS IPA & Upload to TestFlight

# Builds iOS app using EAS CLI --local on GitHub's macOS runner with Xcode 26.3.
# Uses npm postinstall + patch-package to patch expo-modules-core and expo-router.
# Uploads IPA artifact and submits to TestFlight via App Store Connect API key.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      submit_to_testflight:
        description: 'Submit IPA to TestFlight after build?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: |
          echo "Selecting Xcode 26.3..."
          sudo xcode-select -s "/Applications/Xcode_26.3.app/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify patches applied
        run: |
          echo "=== Checking patch status ==="
          ls -la patches/
          echo "=== Verifying expo-modules-core patches ==="
          grep -n "@MainActor" node_modules/expo-modules-core/ios/Core/Views/ViewDefinition.swift | head -3 || true
          echo "=== Verifying expo-router patches ==="
          grep -n "return .done" node_modules/expo-router/ios/Toolbar/RouterToolbarModule.swift | head -3 || true

      - name: Setup EAS CLI
        run: |
          npm install -g eas-cli@latest
          eas --version

      - name: Build iOS Locally (EAS)
        run: |
          mkdir -p build-output
          eas build --platform ios --profile production --local --output build-output/buildtrack.ipa --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Verify IPA
        run: |
          ls -la build-output/buildtrack.ipa
          file build-output/buildtrack.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: buildtrack-ios-ipa
          path: build-output/buildtrack.ipa
          retention-days: 7

      - name: Setup App Store Connect API key
        if: ${{ github.event.inputs.submit_to_testflight == 'true' }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APPLE_API_KEY }}" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          ls -la ~/.appstoreconnect/private_keys/

      - name: Submit to TestFlight
        if: ${{ github.event.inputs.submit_to_testflight == 'true' }}
        run: |
          xcrun altool --upload-app \
            -f build-output/buildtrack.ipa \
            -t ios \
            --apiKey "${{ secrets.APPLE_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPLE_API_ISSUER_ID }}" \
            --verbose

      - name: Cleanup
        if: always()
        run: |
          rm -rf ~/.appstoreconnect/private_keys || true

      - name: Notify
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Build complete!"
            echo "   IPA: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "❌ Build failed"
          fi
