name: Build iOS on macOS (EAS Local) & Upload IPA

# Builds the iOS app locally on GitHub's macOS runner using EAS CLI --local.
# No EAS cloud credits used — compilation happens directly on the runner.
# After build, the IPA is uploaded as an artifact for manual TestFlight submission.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      submit_to_testflight:
        description: 'Submit IPA to TestFlight after build?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup EAS CLI
        run: |
          npm install -g eas-cli@latest
          eas --version

      - name: Build iOS Locally
        run: |
          mkdir -p build-output
          eas build --platform ios --profile production --local --output build-output/buildtrack.ipa --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Verify IPA
        run: |
          ls -la build-output/buildtrack.ipa
          file build-output/buildtrack.ipa

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: buildtrack-ios-ipa
          path: build-output/buildtrack.ipa
          retention-days: 7

      - name: Submit to TestFlight
        if: ${{ github.event.inputs.submit_to_testflight == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
        run: |
          xcrun altool --upload-app \
            -f build-output/buildtrack.ipa \
            -t ios \
            -u "${{ secrets.APPLE_ID }}" \
            -p "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
            --verbose

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Build complete!"
          if [ "${{ github.event.inputs.submit_to_testflight }}" == "true" ]; then
            echo "   Submitted to TestFlight"
          else
            echo "   IPA artifact: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      - name: Notify Failure
        if: failure()
        run: echo "❌ Build failed. Check logs above."
