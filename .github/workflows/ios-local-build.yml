name: Build iOS on macOS (EAS Local) & Upload IPA

# Builds the iOS app locally on GitHub's macOS runner using EAS CLI --local.
# Patches expo-modules-core Swift files BEFORE EAS build to fix Xcode 16/Swift 6 errors.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      submit_to_testflight:
        description: 'Submit IPA to TestFlight after build?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Patch expo-modules-core for Xcode 16
        run: node scripts/patch-expo-modules.js

      - name: Setup EAS CLI
        run: |
          npm install -g eas-cli@latest
          eas --version

      - name: Build iOS Locally (EAS)
        run: |
          mkdir -p build-output
          eas build --platform ios --profile production --local --output build-output/buildtrack.ipa --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Verify IPA
        run: |
          ls -la build-output/buildtrack.ipa
          file build-output/buildtrack.ipa

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: buildtrack-ios-ipa
          path: build-output/buildtrack.ipa
          retention-days: 7

      - name: Submit to TestFlight
        if: ${{ github.event.inputs.submit_to_testflight == 'true' }}
        run: |
          xcrun altool --upload-app \
            -f build-output/buildtrack.ipa \
            -t ios \
            -u "${{ secrets.APPLE_ID }}" \
            -p "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
            --verbose

      - name: Notify
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Build complete!"
            echo "   IPA: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "❌ Build failed"
          fi
