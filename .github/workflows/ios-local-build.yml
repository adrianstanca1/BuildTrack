name: Build iOS on macOS & Upload IPA

# Builds the iOS app locally on GitHub's macOS runner.
# Uses Xcode 16 with a patch for Expo SDK 55 compatibility.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      submit_to_testflight:
        description: 'Submit IPA to TestFlight after build?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Patch Expo Modules for Xcode 16
        run: |
          # Patch expo-modules-core for Swift 6 / Xcode 16 compatibility
          # Known issue: https://github.com/expo/expo/issues/32992
          SWIFT_FILE="node_modules/expo-modules-core/ios/ReactDelegates/ExpoReactDelegate.swift"
          if [ -f "$SWIFT_FILE" ]; then
            # Create backup
            cp "$SWIFT_FILE" "$SWIFT_FILE.bak"
            # Apply patch: wrap UIViewController() in MainActor.assumeIsolated
            sed -i '' 's/.first(where: { _ in true }) ?? UIViewController()/.first(where: { _ in true }) ?? MainActor.assumeIsolated { UIViewController() }/' "$SWIFT_FILE" 2>/dev/null || \
            sed -i 's/.first(where: { _ in true }) ?? UIViewController()/.first(where: { _ in true }) ?? MainActor.assumeIsolated { UIViewController() }/' "$SWIFT_FILE"
            echo "✅ Patched ExpoReactDelegate.swift"
          fi

      - name: Setup EAS CLI
        run: |
          npm install -g eas-cli@latest
          eas --version

      - name: Build iOS Locally
        run: |
          mkdir -p build-output
          eas build --platform ios --profile production --local --output build-output/buildtrack.ipa --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Verify IPA
        run: |
          ls -la build-output/buildtrack.ipa
          file build-output/buildtrack.ipa

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: buildtrack-ios-ipa
          path: build-output/buildtrack.ipa
          retention-days: 7

      - name: Submit to TestFlight
        if: ${{ github.event.inputs.submit_to_testflight == 'true' }}
        run: |
          xcrun altool --upload-app \
            -f build-output/buildtrack.ipa \
            -t ios \
            -u "${{ secrets.APPLE_ID }}" \
            -p "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
            --verbose

      - name: Notify
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Build complete!"
            echo "   IPA: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "❌ Build failed"
          fi
