name: Build iOS on macOS (EAS Local) & Upload IPA

# Builds the iOS app locally on GitHub's macOS runner using EAS CLI --local.
# Xcode 16 has Swift 6 strict concurrency which breaks Expo SDK 55.
# We disable strict concurrency via build settings instead of patching code.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      submit_to_testflight:
        description: 'Submit IPA to TestFlight after build?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup EAS CLI
        run: |
          npm install -g eas-cli@latest
          eas --version

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Disable Swift Strict Concurrency
        run: |
          # Xcode 16's Swift 6 strict concurrency breaks Expo SDK 55
          # Disable it via build settings in the Xcode project
          cd ios
          
          # Add SWIFT_STRICT_CONCURRENCY = no to project.pbxproj
          # This disables Swift 6 strict concurrency checks
          ruby -e '
            file = "BuildTrack.xcodeproj/project.pbxproj"
            content = File.read(file)
            
            # Find GCC_PREPROCESSOR_DEFINITIONS and add SWIFT_STRICT_CONCURRENCY=no nearby
            # Or add a new build settings section
            if content.include?("SWIFT_STRICT_CONCURRENCY")
              content.gsub!(/SWIFT_STRICT_CONCURRENCY = .*;/, "SWIFT_STRICT_CONCURRENCY = no;")
              puts "Updated SWIFT_STRICT_CONCURRENCY to no"
            else
              # Add to all build settings blocks
              content.gsub!(/(buildSettings = \{)/, "\1\\n\\t\\t\\t\\tSWIFT_STRICT_CONCURRENCY = no;")
              puts "Added SWIFT_STRICT_CONCURRENCY = no"
            end
            
            File.write(file, content)
          '
          
          # Also disable in Podfile for CocoaPods dependencies
          if [ -f "Podfile" ]; then
            echo "Adding post_install hook to disable strict concurrency..."
            ruby -e '
              file = "Podfile"
              content = File.read(file)
              
              # Add post_install hook if not present
              unless content.include?("post_install")
                hook = <<-HOOK
              
              post_install do |installer|
                installer.pods_project.targets.each do |target|
                  target.build_configurations.each do |config|
                    config.build_settings["SWIFT_STRICT_CONCURRENCY"] = "no"
                  end
                end
              end
              HOOK
                content += hook
                puts "Added post_install hook"
              end
              
              File.write(file, content)
            '
          fi

      - name: Build iOS Locally
        run: |
          mkdir -p build-output
          eas build --platform ios --profile production --local --output build-output/buildtrack.ipa --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Verify IPA
        run: |
          ls -la build-output/buildtrack.ipa
          file build-output/buildtrack.ipa

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: buildtrack-ios-ipa
          path: build-output/buildtrack.ipa
          retention-days: 7

      - name: Submit to TestFlight
        if: ${{ github.event.inputs.submit_to_testflight == 'true' }}
        run: |
          xcrun altool --upload-app \
            -f build-output/buildtrack.ipa \
            -t ios \
            -u "${{ secrets.APPLE_ID }}" \
            -p "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
            --verbose

      - name: Notify
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Build complete!"
            echo "   IPA: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "❌ Build failed"
          fi
