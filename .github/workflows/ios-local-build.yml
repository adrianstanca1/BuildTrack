name: Build iOS on macOS (EAS Local) & Upload IPA

# Builds the iOS app locally on GitHub's macOS runner using EAS CLI --local.
# Patches expo-modules-core Swift files BEFORE EAS build to fix Xcode 16/Swift 6 errors.
# Uses patch-package (runs on npm install) + manual fallback for nested node_modules.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      submit_to_testflight:
        description: 'Submit IPA to TestFlight after build?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Patch nested expo-modules-core (expo sub-dependency)
        run: |
          if [ -d "node_modules/expo/node_modules/expo-modules-core/ios" ]; then
            echo "Found nested expo-modules-core — applying patches..."
            node scripts/patch-expo-modules.js
          else
            echo "No nested expo-modules-core found — patch-package handled it"
          fi

      - name: Setup EAS CLI
        run: |
          npm install -g eas-cli@latest
          eas --version

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Patch ExpoModulesCore in Pods
        run: |
          # Patch the Pods source files directly
          PODS_BASE="ios/Pods/ExpoModulesCore/ios"
          if [ -d "$PODS_BASE" ]; then
            echo "Found ExpoModulesCore in Pods — applying patches..."
            node scripts/patch-expo-modules.js "$PODS_BASE"
          else
            echo "ExpoModulesCore not found at $PODS_BASE"
            find ios/Pods -name "ExpoModulesCore" -type d 2>/dev/null | head -5
          fi

      - name: Build iOS with Xcode
        run: |
          cd ios
          xcodebuild -workspace BuildTrack.xcworkspace \
            -scheme BuildTrack \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            archive -archivePath build/BuildTrack.xcarchive
          
          # Export IPA
          xcodebuild -exportArchive \
            -archivePath build/BuildTrack.xcarchive \
            -exportPath ../build-output \
            -exportOptionsPlist exportOptions.plist
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Verify IPA
        run: |
          ls -la build-output/*.ipa
          file build-output/*.ipa

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: buildtrack-ios-ipa
          path: build-output/*.ipa
          retention-days: 7

      - name: Submit to TestFlight
        if: ${{ github.event.inputs.submit_to_testflight == 'true' }}
        run: |
          xcrun altool --upload-app \
            -f build-output/*.ipa \
            -t ios \
            -u "${{ secrets.APPLE_ID }}" \
            -p "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
            --verbose

      - name: Notify
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Build complete!"
            echo "   IPA: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "❌ Build failed"
          fi
