name: Submit iOS to TestFlight
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'EAS Build ID to submit'
        required: true
        default: '917aecf1-608f-4bb5-b241-7099324b8468'

jobs:
  submit-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Download Build from EAS
        run: |
          mkdir -p build-output
          eas build:download --id ${{ github.event.inputs.build_id }} --output build-output/buildtrack.ipa --platform ios
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Install Fastlane
        run: gem install fastlane

      - name: Submit to TestFlight via Fastlane
        run: |
          fastlane pilot upload \
            --ipa build-output/buildtrack.ipa \
            --apple_id 6767887054 \
            --app_identifier ro.stancainvest.buildtrack \
            --username 'adrian.stanca1@icloud.com' \
            --skip_waiting_for_build_processing true \
            --verbose
        env:
          FASTLANE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
