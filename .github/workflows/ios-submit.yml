name: Submit iOS to TestFlight
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'EAS Build ID to submit'
        required: true
        default: '917aecf1-608f-4bb5-b241-7099324b8468'
      artifact_url:
        description: 'Direct artifact URL (optional - will auto-resolve if empty)'
        required: false
        default: 'https://expo.dev/artifacts/eas/iXWBYSfgFHno6EeR9iUpCm.ipa'

jobs:
  submit-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download IPA
        run: |
          mkdir -p build-output
          curl -L -o build-output/buildtrack.ipa "${{ github.event.inputs.artifact_url }}"
          ls -la build-output/

      - name: Upload to TestFlight via altool
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_API_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_LX9G2X2H8A.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_LX9G2X2H8A.p8
          
          xcrun altool --upload-app \
            -f build-output/buildtrack.ipa \
            -t ios \
            --apiKey LX9G2X2H8A \
            --apiIssuer 4e694aa4-8cbc-4de4-bdf2-0ace72694564 \
            --verbose
