name: Submit iOS to TestFlight

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'EAS Build ID to submit'
        required: true
        default: '917aecf1-608f-4bb5-b241-7099324b8468'
      artifact_url:
        description: 'Direct artifact URL'
        required: false
        default: 'https://expo.dev/artifacts/eas/iXWBYSfgFHno6EeR9iUpCm.ipa'

jobs:
  submit-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Download IPA
        run: |
          mkdir -p build-output
          curl -L -o build-output/buildtrack.ipa "${{ github.event.inputs.artifact_url }}"
          ls -la build-output/

      - name: Check if build already exists in App Store Connect
        run: |
          echo "Checking if build already exists in App Store Connect..."
          # Extract CFBundleVersion from IPA info
          unzip -p build-output/buildtrack.ipa Payload/*.app/Info.plist > /tmp/Info.plist
          BUNDLE_VERSION=$(plutil -extract CFBundleVersion raw /tmp/Info.plist 2>/dev/null || echo "unknown")
          echo "Bundle version in IPA: $BUNDLE_VERSION"
          echo "If altool fails with 'duplicate version', this build already exists in App Store Connect."

      - name: Upload to TestFlight via altool
        run: |
          set +e
          xcrun altool --upload-app \
            -f build-output/buildtrack.ipa \
            -t ios \
            -u "${{ secrets.APPLE_ID }}" \
            -p "${{ secrets.APP_SPECIFIC_PASSWORD }}" \
            --verbose
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Upload successful!"
          elif [ $EXIT_CODE -eq 1 ]; then
            echo "⚠️ Upload may have failed. Check logs above for 'duplicate version' — if so, the build already exists."
          fi
          exit $EXIT_CODE
