name: Submit iOS to TestFlight
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'EAS Build ID to submit'
        required: true
        default: '917aecf1-608f-4bb5-b241-7099324b8468'
      artifact_url:
        description: 'Direct artifact URL'
        required: false
        default: 'https://expo.dev/artifacts/eas/iXWBYSfgFHno6EeR9iUpCm.ipa'

jobs:
  submit-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Download IPA
        run: |
          mkdir -p build-output
          curl -L -o build-output/buildtrack.ipa "${{ github.event.inputs.artifact_url }}"
          ls -la build-output/

      - name: Submit to TestFlight via EAS
        run: |
          eas submit --platform ios --path build-output/buildtrack.ipa --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
