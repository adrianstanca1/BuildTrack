name: Expo Preview Build
on:
  pull_request:
    branches: [main]

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: BuildTrack/package-lock.json }
      - run: npm ci --legacy-peer-deps
        working-directory: BuildTrack
      - run: npm install -g eas-cli
      - run: npx eas build --profile preview --platform ios --non-interactive
        working-directory: BuildTrack
        env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}" }
