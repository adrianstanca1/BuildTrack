name: Expo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: BuildTrack/package-lock.json }
      - run: npm ci --legacy-peer-deps
        working-directory: BuildTrack
      - run: npx tsc --noEmit
        working-directory: BuildTrack
      - run: npx expo-doctor
        working-directory: BuildTrack
